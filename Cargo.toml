[workspace]
resolver = "2"
members = ["op-registry", "op-registry-derive", "op-listen", "op-status"]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Declare operations once; derive CLI, tool-list and call adapters from the descriptors"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
futures-util = "0.3"
zeroize = "1"
rmcp = { version = "1", default-features = false, features = ["server"] }
schemars = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "de21d22e31baff78eae7d4ca817b87430bff1f81", features = ["serde", "cli", "http"] }
thiserror = "2"
tokio = "1"
trybuild = "1"
futures-executor = "0.3"
