[workspace]
resolver = "2"
members = ["op-registry", "op-registry-derive", "op-listen", "op-status"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Declare operations once; derive CLI, tool-list and call adapters from the descriptors"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env", "string"] }
futures-util = "0.3"
schemars = "1"
coded-error = { git = "https://github.com/qtpi-bonding/coded-error.git", rev = "ffeaf3949230a8883b56c75e7031346a4f28ed4d", features = ["serde", "cli", "http"] }
thiserror = "2"
tokio = "1"
trybuild = "1"
futures-executor = "0.3"
