[package]
name = "op-registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true

[features]
default = ["schema", "manual", "secrets"]
schema = ["dep:schemars"]
manual = []
secrets = ["dep:zeroize"]
testing = ["manual", "dep:tokio", "tokio/time"]
rmcp = ["dep:rmcp", "dep:tokio"]

[dependencies]
op-registry-derive = { path = "../op-registry-derive", version = "0.3.2" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
futures-util = { workspace = true, features = ["sink"] }
futures-channel = { workspace = true }
coded-error = { workspace = true }
thiserror = { workspace = true }
schemars = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
rmcp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["sync"] }

[dev-dependencies]
trybuild = { workspace = true }
futures-executor = { workspace = true }
tokio = { workspace = true, features = ["rt", "time", "macros", "io-util", "test-util"] }
rmcp = { workspace = true, features = ["server", "client"] }
# MIT; resolvers and TLS off: the tests only call `is_valid` on in-memory schemas.
jsonschema = { version = "0.61.2", default-features = false }

[[test]]
name = "testing_kit"
required-features = ["testing"]

[[test]]
name = "paths"
required-features = ["testing"]
