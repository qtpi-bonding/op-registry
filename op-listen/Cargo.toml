[package]
name = "op-listen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared listener for op-registry: cursors, frames, per-app gates and a reconnecting follower"

[dependencies]
op-registry = { path = "../op-registry", version = "0.3.2" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
schemars = { workspace = true }
coded-error = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "macros", "sync"] }

[features]
default = ["detach"]
detach = ["tokio/rt"]
testkit = ["detach"]

[dev-dependencies]
op-registry = { path = "../op-registry", version = "0.3.2", features = ["testing"] }
tokio = { workspace = true, features = ["test-util", "rt", "macros", "time"] }
futures-executor = { workspace = true }
