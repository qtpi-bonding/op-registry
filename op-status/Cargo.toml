[package]
name = "op-status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared status types, StatusSource and a status get operation for op-registry"

[features]
default = []
registry = ["dep:op-registry", "dep:clap", "dep:schemars"]
listen = ["registry", "dep:op-listen"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures-util = { workspace = true }
coded-error = { workspace = true }
thiserror = "2"
op-registry = { path = "../op-registry", version = "0.1.0", optional = true }
op-listen = { path = "../op-listen", version = "0.1.0", optional = true }
clap = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
op-listen = { path = "../op-listen", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }
futures-executor = "0.3"
op-registry = { path = "../op-registry", version = "0.1.0" }
clap = { workspace = true }
schemars = { workspace = true }

[[test]]
name = "ops"
required-features = ["registry"]

[[test]]
name = "watch"
required-features = ["listen"]
